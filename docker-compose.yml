version: '3.8'

services:
  # PHP-FPM Service
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: marketplace-app
    restart: always
    volumes:
      - ./marketplace_app:/var/www/html
    environment:
      # Database
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-marketplace_db}
      DB_USERNAME: ${DB_USERNAME:-marketplace_user}
      DB_PASSWORD: ${DB_PASSWORD:?err}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?err}

      # Laravel
      APP_NAME: Marketplace
      APP_ENV: production
      APP_KEY: ${APP_KEY:?err}    
      APP_DEBUG: "false"
      APP_URL: http://localhost
    depends_on:
      - mysql
    networks:
      - marketplace

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: marketplace-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./marketplace_app:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - marketplace

  # MySQL Service
  mysql:
    image: mysql:8
    container_name: marketplace_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?err}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3310:3306" 
    volumes:
      - marketplace_mysql_data:/var/lib/mysql
    networks:
      - marketplace

networks:
  marketplace:

volumes:
  marketplace_mysql_data:
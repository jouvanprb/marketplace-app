---
- name: Provision and Deploy Marketplace App to AWS EC2 (Amazon Linux 2)
  hosts: aws_ec2
  become: yes  # Menjalankan perintah sebagai root/sudo

  vars:
    # Path folder proyek disatukan di sini agar konsisten
    project_path: "/home/ec2-user/marketplace-app"
    
    # Mengambil value dari Jenkins extra-vars / env vars (dengan fallback default aman)
    mysql_root_password: "{{ db_root_password | default('secret_root_password') }}"
    mysql_database: "{{ db_database | default('marketplace_db') }}"
    mysql_user: "{{ db_user | default('marketplace_user') }}"
    mysql_password: "{{ db_password | default('secret_password') }}"

  tasks:
    # --- STAGE 1: PROVISIONING & SYSTEM PACKAGES ---
    - name: Update yum package cache
      ansible.builtin.yum:
        update_cache: yes

    - name: Install required system packages (Git & Docker)
      ansible.builtin.yum:
        name:
          - git
          - docker
        state: present

    - name: Ensure Docker service is started and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Install Docker Compose v2 binary
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Add ec2-user to docker group
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: yes

    # --- STAGE 2: REPOSITORY & PERMISSIONS ---
    - name: Clone or Pull latest project repository from GitHub
      ansible.builtin.git:
        repo: 'https://github.com/jouvanprb/marketplace-app'
        dest: "{{ project_path }}"
        version: main
        force: yes

    - name: Ensure correct ownership for project directory
      ansible.builtin.file:
        path: "{{ project_path }}"
        owner: ec2-user
        group: ec2-user
        recurse: yes

    # --- STAGE 3: SECURE DYNAMIC .ENV GENERATION ---
    - name: Generate production .env file dynamically
      ansible.builtin.copy:
        dest: "{{ project_path }}/.env"
        content: |
          APP_NAME=Marketplace
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=http://localhost

          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE={{ mysql_database }}
          DB_USERNAME={{ mysql_user }}
          DB_PASSWORD={{ mysql_password }}
          DB_ROOT_PASSWORD={{ mysql_root_password }}
        owner: ec2-user
        group: ec2-user
        mode: '0600' # Keamanan: Hanya ec2-user yang bisa membaca file ini

    # --- STAGE 4: DOCKER DEPLOYMENT ---
    - name: Run Docker Compose up to build and start containers
      ansible.builtin.shell: |
        /usr/local/bin/docker-compose -f {{ project_path }}/docker-compose.yml up -d --build
      args:
        executable: /bin/bash
      register: compose_output

    - name: Show Docker Compose output
      ansible.builtin.debug:
        var: compose_output.stdout_lines